<script>
  const searchInput = document.getElementById('reimagine-hero-search-input');
  const clearBtn = document.getElementById('ny-hero-search-clear');

  function toggleClearBtn() {
    if (searchInput.value.length > 0) {
      clearBtn.classList.remove('hidden');
      clearBtn.classList.add('flex');
    } else {
      clearBtn.classList.add('hidden');
      clearBtn.classList.remove('flex');
    }
  }

  searchInput.addEventListener('input', toggleClearBtn);

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    toggleClearBtn();
    searchInput.focus();
  });

  // run once on load in case the field is pre-filled
  toggleClearBtn();
</script>
<script>

document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('reimagine-hero-search-input');
    const submitSearch = document.getElementById('reimagine-hero-search-submit');
    console.log(searchInput)
    function searchServices(e) {
        e.preventDefault();
        var searchTerm = searchInput.value;

        if (!searchTerm.trim()) {  // Check for empty or whitespace-only input
            window.location.href = "/search";
        } else {
            // First replace & with " and ", then encodeURIComponent
            const cleanSearchTerm = searchTerm.replace(/&/g, 'and');
            const encodedSearchTerm = encodeURIComponent(cleanSearchTerm);

            // Split the encoded term into parts to handle spaces correctly
            const parts = encodedSearchTerm.split('+');
            const properlyEncodedParts = parts.map(part => {
                if (part.includes('and')) {
                    return part.replace(/&/g, ' and').replace(/\+/g, '%20');  // Fix any remaining issues
                }
                return encodeURIComponent(part);
            });

            window.location.href = `/search/?searchstax[query]=${parts.join('%20')}&searchstax[page]=1&searchstax[model]=Sitewide`;
        }
    }

    submitSearch.addEventListener("click", searchServices);
});

</script>

function loadRandomImage() {
  const randomIndex = Math.floor(Math.random() * images.length);
  const selectedImage = images[randomIndex];

  const imageElement = document.getElementById('random-reload-image');
  const captionElement = document.getElementById('random-reload-caption');

  // Update the image and caption
  imageElement.src = selectedImage.src;
  imageElement.alt = selectedImage.alt;
  captionElement.textContent = selectedImage.caption;

  // Remove any previous focal-point classes
  imageElement.classList.remove(
    'object-left',
    'object-center',
    'object-right'
  );

  // Add the focal-point class based on the selected image
  imageElement.classList.add(`object-${selectedImage.focalPoint}`);
}

// Load a random image when the page loads
window.addEventListener('load', loadRandomImage);
